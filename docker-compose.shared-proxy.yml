version: '3.8'

services:
  backend:
    build:
      context: ./backend
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=travelplanning2026.ru,www.travelplanning2026.ru,localhost,127.0.0.1,80.78.244.121
      - CSRF_TRUSTED_ORIGINS=https://travelplanning2026.ru,https://www.travelplanning2026.ru,http://localhost
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - media_data:/media
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend
    restart: always

volumes:
  media_data:
